addEventListener("resize", () => { if (P.get("w")) return; VW = innerWidth; VH = innerHeight; applyLevel(); render(); });

render();
document.title = "ready";
requestAnimationFrame(loop);
parent.postMessage({ type: "mixer:ready" }, "*");
// ---- interaction: drag = pan, wheel = zoom toward cursor (trees redraw at the new zoom when you stop) ----
let drag = null, rebuild = 0;
const cvsEl = renderer.domElement;
cvsEl.style.cursor = "grab";
cvsEl.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; cvsEl.setPointerCapture(e.pointerId); cvsEl.style.cursor = "grabbing"; });
let downAt = null;
cvsEl.addEventListener("pointerup", (e) => {
  drag = null; cvsEl.style.cursor = "grab";
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 5) {
    let best = null, bd = 28;
    for (const b of bots) { const p = new THREE.Vector3(b.x, dtmAt(b.x, b.z), b.z).project(cam); const sx = (p.x + 1) / 2 * VW, sy = (1 - p.y) / 2 * VH - 16; const d = Math.hypot(sx - e.clientX, sy - e.clientY); if (d < bd) { bd = d; best = b; } }
    if (best) parent.postMessage({ type: "mixer:select", id: best.id }, "*");
  }
});
cvsEl.addEventListener("pointerdown", (e) => { downAt = { x: e.clientX, y: e.clientY }; });
cvsEl.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = (e.clientX - drag.x) / UP, dy = (e.clientY - drag.y) / UP; drag = { x: e.clientX, y: e.clientY };
  target.addScaledVector(right, -dx / ppm).addScaledVector(upv, dy / ppm); render();
});
cvsEl.addEventListener("wheel", (e) => {
  e.preventDefault();
  const oldScale = apx * UP * Math.SQRT2, oldUP = UP;
  const nl = Math.min(LEVELS.length - 1, Math.max(0, lvl + (e.deltaY < 0 ? 1 : -1)));
  if (nl === lvl) return;
  lvl = nl; applyLevel();
  const newScale = apx * UP * Math.SQRT2;   // screen px per metre
  const ox = e.clientX - VW / 2, oy = VH / 2 - e.clientY;
  target.addScaledVector(right, ox / oldScale - ox / newScale).addScaledVector(upv, oy / oldScale - oy / newScale);
  render();
  clearTimeout(rebuild); rebuild = setTimeout(() => { buildTrees(); render(); }, 180);
}, { passive: false });
</script></body></html>
